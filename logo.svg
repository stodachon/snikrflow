<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA85C"/>
      <stop offset="100%" stop-color="#D2691E"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal chip outline: native binary / hardware -->
  <polygon points="120,14 210,64 210,176 120,226 30,176 30,64"
           fill="#161616" stroke="url(#flowGrad)" stroke-width="4"/>

  <!-- Inner circuit corner ticks -->
  <path d="M30,64 L30,50 M210,64 L210,50 M30,176 L30,190 M210,176 L210,190"
        stroke="#D2691E" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Call-graph / flow path: entry node -> intermediate -> sink node -->
  <g fill="none" stroke="url(#flowGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M62,168 L96,120 L120,150 L162,76" stroke-dasharray="1,0"/>
  </g>

  <!-- Entry node (JNI / source) -->
  <circle cx="62" cy="168" r="9" fill="#161616" stroke="#FFA85C" stroke-width="4"/>

  <!-- Intermediate node -->
  <circle cx="96" cy="120" r="6" fill="#D2691E"/>
  <circle cx="120" cy="150" r="6" fill="#D2691E"/>

  <!-- Sink node: highlighted -->
  <circle cx="162" cy="76" r="12" fill="#161616" stroke="#FF7A29" stroke-width="4"/>
  <circle cx="162" cy="76" r="5" fill="#FF7A29"/>

  <!-- Crosshair marker on the sink: "this is where to look" -->
  <path d="M162,54 L162,62 M162,90 L162,98 M140,76 L148,76 M176,76 L184,76"
        stroke="#FF7A29" stroke-width="3" stroke-linecap="round"/>
</svg>
